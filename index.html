<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>中国旅行地图</title>
    <script>
      window._AMapSecurityConfig = {
        securityJsCode: '%VITE_AMAP_SECURITY_CODE%',
      }
    </script>
    <script src="https://webapi.amap.com/maps?v=2.0&key=%VITE_AMAP_KEY%&plugin=AMap.ToolBar,AMap.Scale"></script>
    <style>
      #root-loading {
        display: flex; align-items: center; justify-content: center;
        height: 100vh; background: #f5f7fa; flex-direction: column; gap: 12px;
        font-family: 'Noto Sans SC', sans-serif; color: rgba(255, 255, 255, 0.7);
      }
      #root-loading .spinner {
        width: 40px; height: 40px; border: 3px solid rgba(255, 255, 255, 0.2);
        border-top-color: #1a73e8; border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="root-loading">
        <div class="spinner"></div>
        <div>地图加载中...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
